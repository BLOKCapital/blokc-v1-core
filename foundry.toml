# Full reference https://github.com/foundry-rs/foundry/tree/master/config

[profile.default]
  auto_detect_solc = false
  bytecode_hash = "none"
  cbor_metadata = false
  ffi = true
  fuzz = { runs = 1_000 }
  gas_reports = ["*"]
  libs = ["lib"]
  optimizer = true
  optimizer_runs = 10_000
  out = "out"
  script = "script"
  solc_version = "0.8.31"
  src = "src"
  test = "test"
  via_ir = true
  # E2E simulation (test/e2e/E2ESimulation.t.sol) writes its phase marker
  # (test/e2e/.e2e-addresses.json) and the verification report (docs/BETA1_E2E_VERIFICATION.md)
  fs_permissions = [
    { access = "read", path = "test/e2e" },
    { access = "read", path = "docs" },
    { access = "write", path = "test/e2e" },
    { access = "write", path = "docs" },
  ]

[profile.ci]
  fuzz = { runs = 1_000 }
  verbosity = 2

remappings = [
    "@uniswap/v2-periphery/=lib/v2-periphery/"
]

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[rpc_endpoints]
  arbitrum = "https://arbitrum-mainnet.infura.io/v3/${API_KEY_INFURA}"
  avalanche = "https://avalanche-mainnet.infura.io/v3/${API_KEY_INFURA}"
  bsc = "https://bsc-dataseed.binance.org"
  goerli = "https://goerli.infura.io/v3/${API_KEY_INFURA}"
  localhost = "http://localhost:8545"
  mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
  optimism = "https://optimism-mainnet.infura.io/v3/${API_KEY_INFURA}"
  polygon = "https://polygon-mainnet.infura.io/v3/${API_KEY_INFURA}"
  sepolia = "https://sepolia.infura.io/v3/${API_KEY_SEPOLIA}"
  arbitrum-sepolia = "${RPC_URL_ARBITRUM_SEPOLIA}"
