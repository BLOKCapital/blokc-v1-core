name: Claude PR Review

on:
  issue_comment:
    types: [created]
  # Authors can't request a review from themselves on GitHub, so adding the
  # `claude-review` label to a PR is the way to request one on your own PRs.
  pull_request:
    types: [labeled]

# The GITHUB_TOKEN built-in secret is read-only at the org level (BLOKCapital).
# We use a PAT with issues:write scope stored as GH_PAT instead.
# If GH_PAT isn't set, falls back to GITHUB_TOKEN (which may fail to post reviews).

jobs:
  review:
    name: Claude Code Review
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request' &&
        github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Claude PR Review
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 .github/scripts/pr_review.py
