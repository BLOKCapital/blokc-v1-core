name: Claude PR Review

on:
  issue_comment:
    types: [created]

# The GITHUB_TOKEN built-in secret is read-only at the org level (BLOKCapital).
# We use a PAT with issues:write scope stored as GH_PAT instead.
# If GH_PAT isn't set, falls back to GITHUB_TOKEN (which may fail to post reviews).

jobs:
  review:
    name: Claude Code Review
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Claude PR Review
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 .github/scripts/pr_review.py
